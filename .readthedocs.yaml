# Сборка сайта https://docs.inkov.dev/projects/termisations/ на Read the Docs.
# Проект - subproject основного проекта домена docs.inkov.dev.
# Справка: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"

mkdocs:
  configuration: mkdocs.yml
  # Любое предупреждение (битая ссылка или якорь, страница вне навигации)
  # останавливает сборку, опубликованной остается предыдущая версия сайта
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
