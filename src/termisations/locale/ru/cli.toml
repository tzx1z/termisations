"port out of range 1-65535: {number}" = "порт вне диапазона 1-65535: {number}"
"examples:\n  termisations --mock\n      emulated stanza stream, without network or an account\n  termisations --jid alice@example.org\n      connect to the server with the interface\n  termisations --jid alice@example.org --to bob@example.org --message \"text\"\n      send a message without the interface, for scripts and cron\n  df -h | termisations --jid alice@example.org --to bob@example.org --stdin\n      send the output of a command" = "примеры:\n  termisations --mock\n      эмулированный поток строф, без сети и учетной записи\n  termisations --jid alice@example.org\n      подключение к серверу с интерфейсом\n  termisations --jid alice@example.org --to bob@example.org --message \"текст\"\n      отправить сообщение без интерфейса, для скриптов и cron\n  df -h | termisations --jid alice@example.org --to bob@example.org --stdin\n      отправить вывод команды"
"profile files (default paths, the XDG_* variables change them):\n  ~/.config/termisations/<jid>/config.toml\n      settings; on the first launch an example with explanations is created\n  ~/.local/share/termisations/<jid>/\n      message history, OMEMO keys and the profile resource\n  ~/.cache/termisations/<jid>/client.log\n      log" = "файлы профиля (пути по умолчанию, их меняют переменные XDG_*):\n  ~/.config/termisations/<jid>/config.toml\n      настройки; при первом запуске создается пример с пояснениями\n  ~/.local/share/termisations/<jid>/\n      история переписки, ключи OMEMO и ресурс профиля\n  ~/.cache/termisations/<jid>/client.log\n      журнал"
"exit codes of sending without the interface:\n  0 - sent, 1 - not sent, 2 - error in the arguments or the config" = "коды возврата отправки без интерфейса:\n  0 - отправлено, 1 - не отправлено, 2 - ошибка в аргументах или конфиге"
"Terminal XMPP client with protocol transparency." = "Терминальный XMPP-клиент с прозрачностью протокола."
