# Русский перевод строк termisations/core/profile.py.
# Ключ - английская строка из кода, значение - перевод.

"termisations profile config.\n\nThe file was created on the first launch of the profile as an example.\nAll settings are commented out, and the client runs with the default\nvalues. To change a setting, remove the \"# \" at the start of the line and\nedit the value." = "Конфиг профиля termisations.\n\nФайл создан при первом запуске профиля как пример. Все настройки\nзакомментированы, и клиент работает со значениями по умолчанию. Чтобы\nизменить настройку, уберите \"# \" в начале строки и поправьте значение."
"Priority: a command line flag beats the config, and the config beats the\ndefault. The profile is selected by the --jid flag or the TERMISATIONS_JID\nvariable, so the account address is not in this file: the directory name\nsets it." = "Приоритет: флаг командной строки важнее конфига, конфиг важнее умолчания.\nПрофиль выбирает флаг --jid или переменная TERMISATIONS_JID, поэтому адреса\nучетной записи в этом файле нет: его задает имя каталога."
"Profile files:\n  {config}\n      this config\n  {data}\n      message history, OMEMO keys and the profile resource\n  {cache}\n      client.log and the capabilities cache, safe to delete at any time" = "Файлы профиля:\n  {config}\n      этот конфиг\n  {data}\n      история переписки, ключи OMEMO и ресурс профиля\n  {cache}\n      журнал client.log и кэш возможностей, удалять можно в любой момент"
"Emulator settings (--mock, section [mock]) are read from another file:\n{shared}" = "Настройки эмулятора (--mock, секция [mock]) читаются не отсюда, а из\n{shared}"
"Resource: the server uses it to tell this client from your other devices.\nThe default is termisations.<random tail>: the tail was created once for\nthis profile and is stored in {resource_file}" = "Ресурс: по нему сервер отличает этот клиент от других ваших устройств.\nПо умолчанию termisations.<случайный хвост>: хвост создан один раз для\nэтого профиля и хранится в {resource_file}"
"Server address and port, bypassing the SRV record. Needed if the domain\nhas no SRV record or the server is reachable at another address." = "Адрес и порт сервера в обход записи SRV. Нужны, если у домена нет записи\nSRV или сервер доступен по другому адресу."
"A command that prints the password to standard output. Without it the\npassword is looked up in the system keyring (service termisations), then in\nthe TERMISATIONS_PASSWORD variable, otherwise it is asked for at startup.\nAll methods are described in the README, section \"Password\"." = "Команда, которая печатает пароль в стандартный вывод. Если она не задана,\nпароль ищется в системном keyring (служба termisations), затем в переменной\nTERMISATIONS_PASSWORD, иначе запрашивается при старте. Все способы описаны\nв README, раздел \"Пароль\"."
"Fedora keyring (GNOME Keyring, KWallet), the password is stored with\n  secret-tool store --label='XMPP {jid}' jid {jid} type xmpp" = "Связка ключей Fedora (GNOME Keyring, KWallet), пароль сохраняется командой\n  secret-tool store --label='XMPP {jid}' jid {jid} type xmpp"
"The pass password manager: store the password with pass insert xmpp/{jid}\nand set password_command to \"pass show xmpp/{jid}\"." = "Менеджер паролей pass: сохранить командой pass insert xmpp/{jid}, а в\npassword_command указать \"pass show xmpp/{jid}\"."
"SASL2 and Bind 2, if the server announced them. false switches to regular\nSASL: a fallback for a server with a broken SASL2 implementation." = "SASL2 и Bind 2, если сервер их объявил. false включает обычный SASL:\nэто запасной путь для сервера с неисправной реализацией SASL2."
"Direct TLS per XEP-0368 instead of STARTTLS. If the key is not set, the\nmethod is chosen by the SRV record." = "Прямой TLS по XEP-0368 вместо STARTTLS. Если ключ не задан, способ\nвыбирается по записи SRV."
"Server certificate verification. Turn it off only for your own server\nwith a self-signed certificate." = "Проверка сертификата сервера. Выключайте только для своего сервера\nс самоподписанным сертификатом."
"Layout at startup: focus - the conversation only, split - the conversation\nand the RAW XML panel, debug - the RAW XML panel full screen. Ctrl+D\nswitches it in the client." = "Раскладка при запуске: focus - только беседа, split - беседа и панель\nRAW XML, debug - панель RAW XML на весь экран. В клиенте переключается\nсочетанием Ctrl+D."
"How many recent stanzas the RAW XML panel keeps." = "Сколько последних строф хранит панель RAW XML."
"Interface language: en or ru. By default it is taken from the system\nlocale. The --lang flag and the TERMISATIONS_LANG variable take precedence\nover this key. The /lang command changes the language in a running client\nuntil it exits and does not write the choice to this file." = "Язык интерфейса: en или ru. По умолчанию берется из локали системы.\nФлаг --lang и переменная TERMISATIONS_LANG важнее этого ключа. Команда\n/lang меняет язык в работающем клиенте до выхода и не записывает выбор\nв этот файл."
"Log level of client.log: debug, info, warning, error, critical." = "Уровень журнала client.log: debug, info, warning, error, critical."
"no profile selected: there is nowhere to move the data" = "профиль не выбран: переносить данные некуда"
"no profile selected: the resource is stored only in a profile" = "профиль не выбран: ресурс хранится только в профиле"
"no profile selected: there is nowhere to put the example config" = "профиль не выбран: пример конфига класть некуда"
